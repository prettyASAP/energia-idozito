name: EAS build

# Kézi indítás: Actions → EAS build → Run workflow.
# Szükséges secret: EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# Az `eas init` után az app.json tartalmazza az extra.eas.projectId-t — enélkül a build nem indul.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        default: all
        options: [all, android, ios]
      profile:
        description: EAS build profil
        type: choice
        default: production
        options: [production, preview]
      submit:
        description: Beküldés az áruházba a build után (eas submit)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck && npm test -- --ci
      - name: EAS build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
      - name: EAS submit
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: eas submit --platform ${{ inputs.platform }} --profile production --non-interactive --latest
